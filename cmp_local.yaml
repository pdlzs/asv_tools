# 本地测试配置

machines:
  server1:
    host: "local"
    hostname: "z4"       # 建议 ≤4 字符，ASV 显示 z4-8bc
    username: "luo"
    asv_project_dir: "/mnt/d/code/numpy/benchmarks"

  server2:
    host: "local"
    hostname: "kp"       # 建议 ≤4 字符，ASV 显示 kp-8bc
    username: "luo"
    asv_project_dir: "/mnt/d/code/numpy/benchmarks_server2"

# ASV compare 执行脚本（原 scripts 字段）
compare_scripts:
  server1: |
    cd /mnt/d/code/numpy/benchmarks
    rm -rf results
    asv machine --yes --machine compare_machine
    asv run -b "bench_reduce" --python=same --set-commit-hash HEAD

  server2: |
    cd /mnt/d/code/numpy/benchmarks
    rm -rf results
    asv machine --yes --machine compare_machine
    asv run -b "bench_reduce" --python=same --set-commit-hash HEAD

# collect 采集脚本（可选，当 compare.collect=true 时使用）
collect_scripts:
  server1: |
    cd /mnt/d/code/numpy/benchmarks
    source /mnt/d/code/numpy/numpy_dev_env.sh
    eval "$COLLECT_ENV"

  server2: |
    cd /mnt/d/code/numpy/benchmarks
    source /mnt/d/code/numpy/numpy_dev_env.sh
    eval "$COLLECT_ENV"

compare:
  show_all: true
  collect: false                  # 是否在 compare 前执行 collect 采集

output:
  dir: "./cmp_results"
  custom_info: "local_test"

runtime:
  ssh_timeout: 30
  log_level: "INFO"