# ASV Continuous 配置文件
# 用于在指定机器上对比两个 commit 的性能
# 使用方法: python main.py cont cont.yaml

# 全局环境变量（可选）- 可在 scripts 中以 {VAR} 引用，运行时自动导出
# export:
#   BENCH_NAME: "bench_reduce"
#   PYTHON_VER: "same"

# 示例1: 本地单机执行
machines:
  local_machine:
    host: "local"
    hostname: "z4"           # 显示名称（可选）
    username: "luo"
    asv_project_dir: "/mnt/d/code/numpy/benchmarks"

# 示例2: 多台远程机器执行（取消注释使用）
# machines:
#   server1:
#     host: "zen4.example.com"
#     port: 22
#     username: "user"
#     asv_project_dir: "/home/user/benchmark"
#
#   server2:
#     host: "kunpeng920b.example.com"
#     port: 22
#     username: "user"
#     asv_project_dir: "/home/user/benchmark"

# 要对比的两个 commit（所有机器使用相同 commits）
commits:
  base: "HEAD~1"      # 基准 commit（可以是 commit hash、分支名、tag）
  branch: "HEAD"      # 测试 commit

# 每台机器的执行脚本（可选，用于设置环境）
cont_scripts:
  local_machine: |
    cd {work_dir}

# 示例2 的 cont_scripts（取消注释使用）
# cont_scripts:
#   server1: |
#     source ~/miniconda3/bin/activate myenv
#     cd {work_dir}
#
#   server2: |
#     source ~/miniconda3/bin/activate myenv
#     cd {work_dir}

# 输出配置
output:
  dir: "./cont_results"
  custom_info: "numpy_test"

# 运行时配置
runtime:
  ssh_timeout: 30
  log_level: "INFO"
