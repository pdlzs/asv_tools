# ASV Benchmark 对比配置文件
# 使用方法: python main.py cmp cmp.yaml

# 全局环境变量（可选）- 可在 scripts 中以 {VAR} 引用，运行时自动导出
# export:
#   BENCH_NAME: "bench_reduce"
#   PYTHON_VER: "same"

machines:
  server1:
    host: "zen4.example.com"      # 或 "local" 表示本地执行
    port: 22
    username: "user"
    asv_project_dir: "/home/user/benchmark"

  server2:
    host: "kunpeng920b.example.com"
    port: 22
    username: "user"
    asv_project_dir: "/home/user/benchmark"

# ASV compare 执行脚本（原 scripts 字段）
compare_scripts:
  server1: |
    source ~/miniconda3/bin/activate myenv
    cd {work_dir}
    rm -rf results
    asv run -b "bench_app" --python=same

  server2: |
    source ~/miniconda3/bin/activate myenv
    cd {work_dir}
    rm -rf results
    asv run -b "bench_reduce" --python=same

# collect 采集脚本（可选，当 compare.collect=true 时使用）
collect_scripts:
  server1: |
    source ~/miniconda3/bin/activate myenv
    eval "$COLLECT_ENV"

  server2: |
    source ~/miniconda3/bin/activate myenv
    eval "$COLLECT_ENV"

compare:
  show_all: true                  # 是否显示未变化的 benchmark
  collect: false                  # 是否在 compare 前执行 collect 采集

output:
  dir: "./cmp_results"
  custom_info: "numpy_test"       # 可选，自定义标识
  skip_excel: false               # 是否跳过生成 Excel 文件
  skip_ratio_na: false            # 是否跳过 Ratio 为 n/a 的行（影响 TXT 和 Excel）

runtime:
  ssh_timeout: 30           # SSH 连接超时 (秒)
  execution_timeout: 7200   # 命令执行超时 (秒)，默认 2 小时
  log_level: "INFO"