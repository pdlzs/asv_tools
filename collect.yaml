# 性能配置采集示例配置文件
# 用于跨机器性能配置对比

machines:
  server1:
    host: "zen4.example.com"
    hostname: "zen4"                  # 显示名称（用于对比报告标识）
    port: 22
    username: "user"

  server2:
    host: "kunpeng950.example.com"
    hostname: "kunpeng950"            # 显示名称
    port: 22
    username: "user"

scripts:
  server1: |
    # AMD Zen4 服务器环境初始化
    source ~/miniconda3/bin/activate numpy_bench
    export OMP_NUM_THREADS=192

  server2: |
    # 鲲鹏 950 服务器环境初始化
    source /opt/conda/bin/activate numpy_bench
    export OMP_NUM_THREADS=64

output:
  dir: "./collect_results"
  custom_info: "zen4_vs_kp950"