# 性能配置采集示例配置文件
# 用于跨机器性能配置对比

# 全局环境变量（可选）- 可在 scripts 中以 {VAR} 引用，运行时自动导出
# export:
#   ENV_NAME: "numpy_bench"

machines:
  server1:
    host: "zen4.example.com"
    hostname: "zen4"                  # 显示名称（用于对比报告标识）
    port: 22
    username: "user"

  server2:
    host: "kunpeng950.example.com"
    hostname: "kunpeng950"            # 显示名称
    port: 22
    username: "user"

collect_scripts:
  server1: |
    # AMD Zen4 服务器 - 在当前 shell 执行（先激活 conda）
    source ~/miniconda3/bin/activate numpy_bench
    eval "$COLLECT_ENV"

  server2: |
    # 鲲鹏 950 服务器 - 进入 Docker 容器执行
    docker exec numpy_container sh -c "$COLLECT_ENV"

    # 其他方式示例（取消注释使用）：
    # === 进入容器 + 激活 conda ===
    # docker exec numpy_container bash -c 'source /opt/conda/bin/activate numpy_bench; eval "$COLLECT_ENV"'

    # === 进入 Kubernetes Pod ===
    # kubectl exec numpy-pod -n benchmark -- sh -c "$COLLECT_ENV"

    # === 进入 Pod + 激活 conda ===
    # kubectl exec numpy-pod -n benchmark -- bash -c 'source /opt/conda/bin/activate numpy_bench; eval "$COLLECT_ENV"'

output:
  dir: "./collect_results"
  custom_info: "zen4_vs_kp950"

# COLLECT_ENV 使用说明：
# 采集分为两部分：
# 1. 宿主机硬件信息（dmidecode、CPU、内存、NUMA、内核参数）- 自动执行
# 2. 环境信息（Python、GCC、BLAS、环境变量）- 用户在 collect_scripts 中显式执行
#
# 必须在 collect_scripts 中执行 COLLECT_ENV 变量：
#   eval "$COLLECT_ENV"              # 当前 shell
#   docker exec container sh -c "$COLLECT_ENV"  # 进入容器
#   docker exec container bash -c 'source activate env; eval "$COLLECT_ENV"'  # 容器+conda
#
# 注意：如果不执行 COLLECT_ENV，环境信息将为 NA
