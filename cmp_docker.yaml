# Docker 容器场景配置示例
# 使用方法: python main.py cmp cmp_docker.yaml

machines:
  server1:
    host: "zen4.example.com"
    port: 22
    username: "user"
    # 容器内的 ASV 项目目录路径（用于下载结果）
    # 需要确保容器内路径与宿主机路径映射正确
    asv_project_dir: "/home/user/benchmark"

  server2:
    host: "kunpeng920b.example.com"
    port: 22
    username: "user"
    asv_project_dir: "/home/user/benchmark"

# ASV compare 执行脚本（原 scripts 字段）
compare_scripts:
  server1: |
    # 在 Docker 容器中执行 ASV benchmark
    docker exec numpy_bench bash -c '
      source /opt/conda/bin/activate numpy_dev
      cd /workspace/numpy/benchmarks
      rm -rf results
      asv run -b "bench_reduce" -b "bench_app" --python=same
    '
    # 将容器内的结果目录复制到宿主机（供后续下载）
    docker cp numpy_bench:/workspace/numpy/benchmarks/results /home/user/benchmark/results

  server2: |
    # 在 Docker 容器中执行 ASV benchmark
    docker exec numpy_bench bash -c '
      source /opt/conda/bin/activate numpy_dev
      cd /workspace/numpy/benchmarks
      rm -rf results
      asv run -b "bench_reduce" --python=same
    '
    # 将容器内的结果目录复制到宿主机
    docker cp numpy_bench:/workspace/numpy/benchmarks/results /home/user/benchmark/results

# collect 采集脚本（可选，当 compare.collect=true 时使用）
# Docker 容器场景：在容器内执行环境采集
collect_scripts:
  server1: |
    docker exec numpy_bench bash -c 'source /opt/conda/bin/activate numpy_dev && eval "$COLLECT_ENV"'

  server2: |
    docker exec numpy_bench bash -c 'source /opt/conda/bin/activate numpy_dev && eval "$COLLECT_ENV"'

compare:
  show_all: true
  collect: false                  # 是否在 compare 前执行 collect 采集

output:
  dir: "./cmp_results"
  custom_info: "docker_test"

runtime:
  ssh_timeout: 30
  log_level: "INFO"