# 性能配置采集示例配置文件
# 本地测试版本

# 全局环境变量（可选）- 可在 scripts 中以 {VAR} 引用，运行时自动导出
# export:
#   ENV_NAME: "myenv"

machines:
  local_machine:
    host: "local"
    hostname: "localhost"             # 显示名称

collect_scripts:
  local_machine: |
    # 本地测试 - 在当前 shell 执行
    eval "$COLLECT_ENV"

    # 其他方式示例（取消注释使用）：
    # === 先激活 conda 再执行 ===
    # source ~/miniconda3/bin/activate myenv
    # eval "$COLLECT_ENV"

    # === 进入 Docker 容器执行 ===
    # docker exec my_container sh -c "$COLLECT_ENV"

    # === 进入容器 + 激活 conda ===
    # docker exec my_container bash -c 'source /opt/conda/bin/activate myenv; eval "$COLLECT_ENV"'

output:
  dir: "./collect_results"
  custom_info: "local_test"

runtime:
  ssh_timeout: 30           # SSH 连接超时 (秒)
  execution_timeout: 300    # 命令执行超时 (秒)，采集命令较快，默认 5 分钟
  log_level: "INFO"