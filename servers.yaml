# 服务器配置文件
# 支持多台服务器，通过name匹配

servers:
  zen4:
    host: "zen4.example.com"
    port: 22
    username: "user"
    # ASV项目目录（包含.asv/目录）
    # ASV结果将存储在: asv_project_dir/results/
    asv_project_dir: "/home/user/benchmark"
    # 可选：指定机器名称（默认为hostname）
    # machine_name: "zen4-server"

  kunpeng920b:
    host: "kunpeng920b.example.com"
    port: 22
    username: "user"
    # ASV项目目录（包含.asv/目录）
    asv_project_dir: "/home/user/benchmark"
    # 可选：指定机器名称
    # machine_name: "kunpeng-server"

  # 本地测试服务器（local模式，跳过SSH）
  local_test1:
    host: "local"
    port: 22
    username: "luo"
    asv_project_dir: "/mnt/c/Users/Luo/Code/numpy/benchmarks"
    machine_name: "local"

  local_test2:
    host: "local"
    port: 22
    username: "luo"
    asv_project_dir: "/mnt/c/Users/Luo/Code/numpy/benchmarks"
    machine_name: "local"


# 默认服务器（用于快速运行）
default_servers: ["local_test1", "local_test2"]

# ASV配置
asv:
  # 要比较的commit选择策略
  # latest: 比较最新的commit
  # specific: 比较指定的commit（通过--commit参数）
  compare_strategy: "latest"
  # 比较的commit（仅当strategy为specific时使用）
  # server1_commit: "abc123"
  # server2_commit: "def456"
  # 是否显示所有benchmark（包括未变化的）
  show_all: true
